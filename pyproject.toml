[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traffic-vae"
version = "0.1.0"
description = "Reproducible CIC-IDS2017 normal-only VAE baseline"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "torch>=2.2", "scikit-learn>=1.3", "threadpoolctl>=3.1"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7"]

[project.scripts]
traffic-vae = "traffic_vae.experiment:main"

[tool.setuptools.packages.find]
where = ["src"]
